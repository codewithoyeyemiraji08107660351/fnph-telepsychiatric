# Production stack for Dokploy (Docker Compose service).
#
# Only the backend is reachable from outside, and only through Dokploy's
# Traefik proxy on HTTPS. MySQL, Redis and RabbitMQ publish no ports.
#
# Every variable below comes from the Environment tab in Dokploy. The template,
# with how to generate each secret, is .env.production.example.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      APP_BASE_URL: ${APP_BASE_URL}
      APP_PORTAL_URL: ${APP_PORTAL_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USE_SSL: "true"

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MFA_REQUIRED: ${MFA_REQUIRED:-true}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-true}

      REMITA_API_BASE_URL: ${REMITA_API_BASE_URL}
      REMITA_SECRET_KEY: ${REMITA_SECRET_KEY}
      REMITA_MERCHANT_ID: ${REMITA_MERCHANT_ID}
      REMITA_SERVICE_TYPE_ID: ${REMITA_SERVICE_TYPE_ID}
      REMITA_API_KEY: ${REMITA_API_KEY}
      REMITA_API_TOKEN: ${REMITA_API_TOKEN}
      REMITA_WEBHOOK_SECRET: ${REMITA_WEBHOOK_SECRET}
      REMITA_READ_TIMEOUT_SECONDS: ${REMITA_READ_TIMEOUT_SECONDS:-30}
      REMITA_TEST_PHONE: ${REMITA_TEST_PHONE:-}


      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-daily}
      DAILY_API_KEY: ${DAILY_API_KEY}
      DAILY_DOMAIN: ${DAILY_DOMAIN}
      DAILY_WEBHOOK_SECRET: ${DAILY_WEBHOOK_SECRET}

      ENROLMENT_REQUIRE_CORROBORATION: ${ENROLMENT_REQUIRE_CORROBORATION:-false}
      UPLOAD_REQUIRE_CLEAN_SCAN: ${UPLOAD_REQUIRE_CLEAN_SCAN:-false}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
    volumes:
      # Uploaded files and issued documents. Back up with the database.
      - fnph_storage:/var/lib/fnph/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 2g

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --defaults-extra-file=/etc/mysql/conf.d/fnph.cnf
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/fnph.cnf:/etc/mysql/conf.d/fnph.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    hostname: fnph-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  internal:
  dokploy-network:
    external: true

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  fnph_storage:
