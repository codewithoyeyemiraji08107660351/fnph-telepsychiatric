spring:
  jpa:
    show-sql: false
  devtools:
    restart:
      enabled: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.fnph.telepsychiatric: INFO

management:
  health:
    # The container health check must reflect the application, not the mail
    # provider. A slow SMTP server would otherwise mark the backend unhealthy
    # and take it out of the proxy's rotation.
    mail:
      enabled: false
