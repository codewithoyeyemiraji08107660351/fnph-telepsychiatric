<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'Follow-up ' + ${issueNumber}">Follow-up recommendation</title>
    <style>
        @page { size: A4; margin: 18mm 16mm; }
        body { font-family: sans-serif; font-size: 11pt; color: #000; line-height: 1.5; }

        /* Header: logo and hospital name/unit sit on one flex row so they
           vertically center against each other regardless of the logo's
           natural aspect ratio, instead of relying on floats. */
        .header {
            display: flex;
            align-items: center;
            gap: 8pt;
            border-bottom: 2pt solid #000;
            padding-bottom: 6pt;
            margin-bottom: 12pt;
        }
        .logo {
            flex: 0 0 auto;
            width: 20mm;
            height: 20mm;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .logo img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
        }
        .header-text { flex: 1 1 auto; }
        .hospital { font-size: 15pt; font-weight: bold; }
        .unit { font-size: 10pt; }

        .doc-title { font-size: 13pt; font-weight: bold; margin: 10pt 0 4pt; letter-spacing: 1pt; }
        .issue-number { font-size: 12pt; font-weight: bold; }
        .meta td { padding: 2pt 0; font-size: 10pt; }
        .meta .label { width: 34mm; color: #333; }
        .body-text { margin-top: 10pt; border: 1pt solid #000; padding: 8pt; }
        .footer { margin-top: 16pt; border-top: 1pt solid #000; padding-top: 8pt; font-size: 9pt; }

        .qr { float: right; text-align: center; width: 32mm; }
        .qr img { width: 30mm; height: 30mm; }
        .qr span { font-size: 7pt; display: block; margin-top: 2pt; }

        /*
         * Signature block, laid out horizontally: a fixed, wide-but-short
         * box holds the signature image (capped height, width auto via
         * object-fit, so a tall/portrait source image is scaled down to
         * fit a horizontal strip rather than rendered at full height), with
         * the name and role sitting beside it rather than stacked beneath
         * a full-size image.
         */
        .signature-block {
            margin-top: 28pt;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 10pt;
        }
        .signature-image {
            flex: 0 0 auto;
            width: 45mm;
            height: 16mm;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .signature-image img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        .signature-text {
            flex: 0 0 auto;
            text-align: right;
        }
        .signature-text .name { font-size: 11pt; font-weight: bold; }
        .signature-text .role { font-size: 9pt; color: #333; }
        .signature-rule {
            margin-top: 4pt;
            border-top: 1pt solid #000;
            width: 65mm;
            margin-left: auto;
        }

        .clearfix::after { content: ""; display: table; clear: both; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <img th:src="${logoDataUri}" alt="FNPH Logo"/>
    </div>
    <div class="header-text">
        <div class="hospital">Federal Neuropsychiatric Hospital, Kaduna</div>
        <div class="unit">Telepsychiatry Service</div>
    </div>
</div>

<div class="qr">
    <img th:src="${qrDataUri}" alt="Verification code"/>
    <span>Scan to verify</span>
</div>

<div class="doc-title">FOLLOW-UP RECOMMENDATION</div>
<div class="issue-number" th:text="${issueNumber}">FU-0000-00000000</div>

<table class="meta">
    <tr><td class="label">Patient</td><td th:text="${patientName}"></td></tr>
    <tr th:if="${reviewInterval}">
        <td class="label">Review in</td><td th:text="${reviewInterval}"></td>
    </tr>
    <tr th:if="${preferredDate}">
        <td class="label">Suggested date</td><td th:text="${preferredDate}"></td>
    </tr>
</table>

<div class="body-text" th:text="${recommendation}"></div>

<div class="signature-block">
    <div class="signature-image">
        <img th:src="${signatureDataUri}" alt="Signature"/>
    </div>
    <div class="signature-text">
        <div class="name">Dr. Muhammad Gidado Ibrahim</div>
        <div class="role">Consultant Psychiatrist</div>
        <div class="signature-rule"></div>
    </div>
</div>

<div class="footer">
    Verify this document at <span th:text="${verificationUrl}"></span>
</div>

</body>
</html>
