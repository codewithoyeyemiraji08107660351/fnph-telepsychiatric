<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: html(body=~{::body-content})}">
<body>
<div th:fragment="body-content">

    <p style="margin:0 0 16px;">Hello <span th:text="${recipientName}">Aisha Bello</span>,</p>

    <p style="margin:0 0 20px;">
        <span th:text="${changedByName}">The administrator</span> has changed what your
        FNPH Telepsychiatry account can do.
    </p>

    <table role="presentation" cellpadding="0" cellspacing="0" width="100%"
           style="background:#f8f9fa;border-radius:6px;margin:0 0 20px;">
        <tr>
            <td style="padding:14px 16px;font-size:14px;line-height:1.7;color:#495057;">
                <strong>Your role is now</strong><br>
                <span th:text="${newPrimaryRole}">Doctor</span>
                <br><br>
                <strong>Reason given</strong><br>
                <span th:text="${reason}">Covering the Tuesday clinic</span>
            </td>
        </tr>
    </table>

    <p style="margin:0;">
        The change takes effect the next time you sign in. If you were not expecting it,
        contact your administrator.
    </p>

</div>
</body>
</html>
